<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Dashboard API ATEI BARTIM - v15</title>
 <style>
 body { font-family: sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
 .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
 h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top: 0; }
 h3 { color: #34495e; font-size: 16px; margin-top: 20px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
 .form-group { margin-bottom: 15px; }
 label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
 input[type="text"], input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
 .row { display: flex; gap: 10px; }
 .col { flex: 1; }
 button { width: 100%; padding: 12px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
 .btn-gps-sync { background-color: #3498db; }
 .btn-location { background-color: #9b59b6; }
 .btn-checkin { background-color: #2ecc71; }
 .btn-checkout { background-color: #e67e22; }
 .btn-info { background-color: #f1c40f; color: #333; }
 .btn-clear { background-color: #7f8c8d; }
 .console-log { background: #1e1e1e; color: #39ff14; padding: 15px; border-radius: 6px; height: 250px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
 .status-auto { font-size: 12px; font-weight: bold; color: #27ae60; background: #e8f8f5; padding: 8px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #a3e4d7; display: none; }
 </style>
</head>
<body>

<div class="container">
 <h2>🛠️ Dasbor ATEI BARTIM💥 <span style="font-size:12px; background:#e74c3c; color:#fff; padding:2px 6px; border-radius:3px;">v15 Auto-Sync Web</span></h2>
 
 <div id="autoSyncStatus" class="status-auto">🔄 Menunggu koneksi otomatis dari halaman presensi web...</div>

 <div class="form-group">
  <label>Bearer Token:</label>
  <input type="text" id="apiToken" value="YDZ0p6qlok7mURXSu7NOBlg5461R8EWL60wIsf4Z50742568">
 </div>

 <div class="row">
  <div class="col form-group">
   <label>User ID:</label>
   <input type="number" id="userId" value="2682">
  </div>
  <div class="col form-group">
   <label>ID 31 (Hanya untuk QR):</label>
   <input type="number" id="id31" value="31">
  </div>
 </div>

 <h3>👤 Parameter Data Profil Ekstensi</h3>
 <div class="row">
  <div class="col form-group">
   <label>Nama:</label>
   <input type="text" id="profName" value="User Test">
  </div>
  <div class="col form-group">
   <label>Email:</label>
   <input type="text" id="profEmail" value="user@example.com">
  </div>
 </div>
 <div class="row">
  <div class="col form-group">
   <label>NIK:</label>
   <input type="text" id="profNik" value="6213000000000000">
  </div>
  <div class="col form-group">
   <label>NIP:</label>
   <input type="text" id="profNip" value="199500000000000000">
  </div>
 </div>
 <div class="row">
  <div class="col form-group">
   <label>ID Unit:</label>
   <input type="number" id="profIdUnit" value="1">
  </div>
  <div class="col form-group">
   <label>Jabatan:</label>
   <input type="text" id="profJabatan" value="Staf Pelaksana">
  </div>
 </div>

 <h3>📍 Koordinat Lokasi</h3>
 <div class="row">
  <div class="col form-group">
   <label>Latitude:</label>
   <input type="text" id="geoLat" value="-2.116357">
  </div>
  <div class="col form-group">
   <label>Longitude:</label>
   <input type="text" id="geoLong" value="115.16722">
  </div>
 </div>

 <div class="form-group">
  <label>Kode QR Mentah / Token Acak Akhir (qr_in / qr_out):</label>
  <input type="text" id="qrTokenInput" value="4b3b50cf73" placeholder="Menunggu kode otomatis masuk..." oninput="handleQrInput(this)">
  <small style="color:#2ecc71; font-weight:bold; font-size:11px;" id="qrStatusHint">*Mendukung sinkronisasi otomatis via extension browser.</small>
 </div>

 <h3>🚀 Fitur Utama Absensi</h3>
 <button class="btn-gps-sync" onclick="sinkronisasiGPS()">🔄 Ambil GPS Browser Asli</button>
 <button class="btn-location" onclick="ujiKirimLokasi()">1. Verifikasi Lokasi (GPS)</button>
 <button class="btn-checkin" onclick="ujiCheckIn()">2. Absen Masuk (Check-In)</button>
 <button class="btn-checkout" onclick="ujiCheckOut()">3. Absen Pulang (Check-Out)</button>

 <h3>📊 Data Pendukung & Rekapitulasi</h3>
 <div class="row">
  <div class="col"><button class="btn-info" onclick="ambilDataHariIni()">Cek Absen Hari Ini</button></div>
  <div class="col"><button class="btn-info" onclick="ambilProfilUser()">Cek Profil User</button></div>
 </div>
 <div class="row">
  <div class="col"><button class="btn-info" onclick="ambilRekapUser()">Cek Ringkasan Rekap</button></div>
  <div class="col"><button class="btn-info" onclick="ambilDataTPP()">Cek Nilai TPP</button></div>
 </div>

 <button class="btn-clear" onclick="logClear()">Bersihkan Konsol</button>

 <div class="console-log" id="consoleOutput">Siap melakukan pengujian...</div>
</div>

<script>
 const channel = new BroadcastChannel('atei_qr_bridge');
 document.getElementById("autoSyncStatus").style.display = "block";
 
 channel.onmessage = function(event) {
  if (event.data && event.data.token) {
   const tokenMasuk = event.data.token;
   document.getElementById("qrTokenInput").value = tokenMasuk;
   
   document.getElementById("autoSyncStatus").innerHTML = `⚡ <b>KODE SINKRON OTOMATIS:</b> Terakhir diperbarui pada ${new Date().toLocaleTimeString()} -> <code>${tokenMasuk}</code>`;
   document.getElementById("autoSyncStatus").style.backgroundColor = "#d4efdf";
   document.getElementById("autoSyncStatus").style.color = "#196f3d";
   document.getElementById("qrStatusHint").innerText = "✨ Token diperbarui otomatis dari halaman web presensi!";
   document.getElementById("qrStatusHint").style.color = "#2ecc71";
  }
 };

 window.addEventListener('DOMContentLoaded', () => {
  sinkronisasiGPS(true);
 });

 function handleQrInput(inputEl) {
  let nilai = inputEl.value.trim();
  const regexTanggal = /^\d{4}-\d{2}-\d{2}/;
  if (regexTanggal.test(nilai)) {
   const cleanedToken = nilai.replace(regexTanggal, '');
   inputEl.value = cleanedToken;
  }
 }

 function sinkronisasiGPS(isSilent = false) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
   (posisi) => {
    document.getElementById("geoLat").value = posisi.coords.latitude;
    document.getElementById("geoLong").value = posisi.coords.longitude;
    if (!isSilent) cetakLog(`[SISTEM] GPS Sinkron! Lat: ${posisi.coords.latitude}, Long: ${posisi.coords.longitude}`);
   },
   (error) => {
    if (!isSilent) cetakLog(`[SISTEM ERROR] Gagal sinkronisasi GPS.`);
   },
   { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
 }

 function dapatkanTanggalSekarang() {
  const hariIni = new Date();
  const yyyy = hariIni.getFullYear();
  let mm = hariIni.getMonth() + 1;
  let dd = hariIni.getDate();
  if (dd < 10) dd = '0' + dd;
  if (mm < 10) mm = '0' + mm;
  return `${yyyy}-${mm}-${dd}`;
 }

 function cetakLog(teks) {
  const consoleEl = document.getElementById("consoleOutput");
  if (consoleEl) {
   consoleEl.innerText += `
` + teks;
   consoleEl.scrollTop = consoleEl.scrollHeight;
  }
 }

 function cetakResponsTeks(awalan, teks) {
  try {
   const parsed = JSON.parse(teks);
   const formatted = JSON.stringify(parsed, null, 2);
   cetakLog(`${awalan} Respons:
${formatted}`);
   return parsed;
  } catch (e) {
   cetakLog(`${awalan} Respons:
${teks}`);
   return null;
  }
 }

 function logClear() {
  document.getElementById("consoleOutput").innerText = "Konsol dibersihkan.";
 }

 function dapatkanHeader() {
  return {
   "Content-Type": "application/json",
   "Accept": "application/json",
   "user-agent": "Dart/3.9 (dart:io)",
   "x-install-id": "e5303a18f7513bca6a0fb995d8c8bbf9e3e22a56a0c07ee9",
   "x-device-platform": "android",
   "x-app-installer": "com.android.vending",
   "x-app-package": "com.digitalnative.atei_bartim",
   "Authorization": "Bearer " + document.getElementById("apiToken").value.trim(),
   "x-device-id": "40622cf44ad36bb1"
  };
 }

 function ujiKirimLokasi() {
  const uid = parseInt(document.getElementById("userId").value);
  const lat = document.getElementById("geoLat").value;
  const long = document.getElementById("geoLong").value;
  
  cetakLog("[GPS] Mengirim data lokasi...");
  const payload = { 
   id: uid, latitude: lat, longitude: long,
   name: document.getElementById("profName").value.trim(),
   email: document.getElementById("profEmail").value.trim(),
   nik: document.getElementById("profNik").value.trim(),
   nip: document.getElementById("profNip").value.trim(),
   id_unit: parseInt(document.getElementById("profIdUnit").value),
   jabatan: document.getElementById("profJabatan").value.trim()
  };

  fetch("https://api-absen.baritotimurkab.go.id/public/api/user/verifikasi_loc", {
   method: 'POST',
   headers: dapatkanHeader(),
   body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(d => { cetakResponsTeks(`[GPS]`, d); })
  .catch(e => { cetakLog(`[ERROR] ${e.message}`); });
 }

 function ujiCheckIn() {
  const uid = parseInt(document.getElementById("userId").value);
  const id31Val = parseInt(document.getElementById("id31").value);
  let rawToken = document.getElementById("qrTokenInput").value.trim();
  const qrFinal = dapatkanTanggalSekarang() + rawToken;
  
  cetakLog(`[CHECK-IN] Mengirim QR: ${qrFinal}`);
  const payload = { id: uid, id_31: id31Val, qr_in: qrFinal };

  fetch("https://api-absen.baritotimurkab.go.id/public/api/user/qr_in", {
   method: 'POST',
   headers: dapatkanHeader(),
   body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(d => { cetakResponsTeks(`[CHECK-IN]`, d); })
  .catch(e => { cetakLog(`[ERROR] ${e.message}`); });
 }

 function ujiCheckOut() {
  const uid = parseInt(document.getElementById("userId").value);
  const id31Val = parseInt(document.getElementById("id31").value);
  let rawToken = document.getElementById("qrTokenInput").value.trim();
  const qrFinal = dapatkanTanggalSekarang() + rawToken;
  
  cetakLog(`[CHECK-OUT] Mengirim QR: ${qrFinal}`);
  const payload = { id: uid, id_31: id31Val, qr_out: qrFinal };

  fetch("https://api-absen.baritotimurkab.go.id/public/api/user/qr_out", {
   method: 'POST',
   headers: dapatkanHeader(),
   body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(d => { cetakResponsTeks(`[CHECK-OUT]`, d); })
  .catch(e => { cetakLog(`[ERROR] ${e.message}`); });
 }

 function ambilDataHariIni() {
  const uid = parseInt(document.getElementById("userId").value);
  cetakLog("[FETCH] Mengambil status absen hari ini...");
  const payload = { id: uid };
  fetch("https://api-absen.baritotimurkab.go.id/public/api/user/get_today", {
   method: 'POST', headers: dapatkanHeader(), body: JSON.stringify(payload)
  }).then(r => r.text()).then(d => { cetakResponsTeks(`[TODAY]`, d); });
 }

 function ambilProfilUser() {
  const uid = document.getElementById("userId").value;
  cetakLog(`[FETCH] Mengambil profil...`);
  fetch(`https://api-absen.baritotimurkab.go.id/public/api/user/${uid}`, {
   method: 'GET', headers: dapatkanHeader()
  }).then(r => r.text()).then(d => { 
   const json = cetakResponsTeks(`[PROFILE]`, d); 
   if(json && json.data) {
     const u = json.data;
     if(u.name) document.getElementById("profName").value = u.name;
     if(u.email) document.getElementById("profEmail").value = u.email;
     if(u.nik) document.getElementById("profNik").value = u.nik;
     if(u.nip) document.getElementById("profNip").value = u.nip;
     if(u.id_unit) document.getElementById("profIdUnit").value = u.id_unit;
     if(u.jabatan) document.getElementById("profJabatan").value = u.jabatan;
   }
  });
 }

 function ambilRekapUser() {
  const uid = document.getElementById("userId").value;
  fetch(`https://api-absen.baritotimurkab.go.id/public/api/user/rekap/${uid}`, {
   method: 'POST', headers: dapatkanHeader()
  }).then(r => r.text()).then(d => { cetakResponsTeks(`[REKAP]`, d); });
 }

 function ambilDataTPP() {
  const uid = document.getElementById("userId").value;
  const h = new Date();
  fetch(`https://api-absen.baritotimurkab.go.id/public/api/user/get_tpp/${uid}/${h.getMonth()+1}/${h.getFullYear()}`, {
   method: 'GET', headers: dapatkanHeader()
  }).then(r => r.text()).then(d => { cetakResponsTeks(`[TPP]`, d); });
 }
</script>
</body>
</html>
